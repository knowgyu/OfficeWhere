      <rect x="876" y="292" width="96" height="70" rx="16" fill="#FFFFFF" stroke="#CCE1D2"/>
      <rect x="862" y="314" width="96" height="70" rx="16" fill="#FFFFFF" stroke="#BBD8C3"/>
      <rect x="890" y="334" width="42" height="11" rx="5.5" fill="#DDEFE2"/>
