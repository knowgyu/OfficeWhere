<svg width="1180" height="620" viewBox="0 0 1180 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">OfficeWhere overview</title>
  <desc id="desc">OfficeWhere desktop app overview with quick search, change history, duplicate review, and read-only source documents.</desc>
  <defs>
    <linearGradient id="ow-bg" x1="0" y1="0" x2="1180" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF6FF"/>
      <stop offset="0.52" stop-color="#F7F4EA"/>
      <stop offset="1" stop-color="#ECF8F0"/>
    </linearGradient>
    <linearGradient id="ow-card-blue" x1="326" y1="206" x2="326" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBFDFF"/>
      <stop offset="1" stop-color="#EEF7FF"/>
    </linearGradient>
    <linearGradient id="ow-card-amber" x1="578" y1="206" x2="578" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF4"/>
      <stop offset="1" stop-color="#F8F1E2"/>
    </linearGradient>
    <linearGradient id="ow-card-green" x1="830" y1="206" x2="830" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FFF9"/>
      <stop offset="1" stop-color="#EDF8F0"/>
    </linearGradient>
    <filter id="ow-shadow" x="40" y="36" width="1100" height="560" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#17324F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1180" height="620" rx="44" fill="url(#ow-bg)"/>
  <circle cx="1042" cy="112" r="96" fill="#D7F0DF" opacity="0.78"/>
  <circle cx="136" cy="510" r="124" fill="#D9EAFE" opacity="0.9"/>

  <g filter="url(#ow-shadow)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
    <rect x="82" y="70" width="1016" height="480" rx="30" fill="#FCFCF8"/>
    <rect x="82" y="70" width="190" height="480" rx="30" fill="#EFF3F5"/>
    <path d="M272 70V550" stroke="#D7DEE3"/>
    <rect x="82.5" y="70.5" width="1015" height="479" rx="29.5" stroke="#D7DEE3"/>

    <text x="124" y="130" fill="#22313A" font-size="28" font-weight="760">OfficeWhere</text>
    <text x="124" y="160" fill="#65727B" font-size="15" font-weight="560" textLength="112" lengthAdjust="spacingAndGlyphs">문서 작업 공간</text>

    <g font-size="18" font-weight="700">
      <rect x="114" y="206" width="130" height="46" rx="14" fill="#DCEBFA"/>
      <text x="148" y="236" fill="#173B5C">검색</text>
      <rect x="114" y="266" width="130" height="46" rx="14" fill="#F5F1E7"/>
      <text x="148" y="296" fill="#5A5244">이력</text>
      <rect x="114" y="326" width="130" height="46" rx="14" fill="#E7F3EA"/>
