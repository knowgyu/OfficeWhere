      <path d="M674 331H708" stroke="#907943" stroke-width="5" stroke-linecap="round"/>
      <path d="M700 321L710 331L700 341" stroke="#907943" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="622" y="316" width="28" height="10" rx="5" fill="#EEDFC1"/>
      <rect x="622" y="342" width="20" height="10" rx="5" fill="#F3E9D7"/>
      <rect x="732" y="316" width="28" height="10" rx="5" fill="#DFF0E3"/>
      <rect x="732" y="342" width="24" height="10" rx="5" fill="#E8F5EB"/>
