    <rect x="435" y="470" width="360" height="46" rx="18" fill="#E9F4ED" stroke="#CBE2D1"/>
    <text x="615" y="501" text-anchor="middle" fill="#274B33" font-size="18" font-weight="720" textLength="220" lengthAdjust="spacingAndGlyphs">원본 문서는 읽기 전용</text>
