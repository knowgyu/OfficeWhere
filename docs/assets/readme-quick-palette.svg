<svg width="1180" height="620" viewBox="0 0 1180 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">OfficeWhere quick search palette</title>
  <desc id="desc">A dark floating quick search palette showing prefix search, selected document result, and a Ctrl/Cmd K action panel.</desc>
  <defs>
    <linearGradient id="qp-bg" x1="0" y1="0" x2="1180" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111A24"/>
      <stop offset="0.56" stop-color="#0A1017"/>
      <stop offset="1" stop-color="#142234"/>
    </linearGradient>
    <linearGradient id="qp-panel" x1="0" y1="146" x2="0" y2="526" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151F2A"/>
      <stop offset="1" stop-color="#0D131A"/>
    </linearGradient>
    <linearGradient id="qp-row" x1="192" y1="326" x2="704" y2="326" gradientUnits="userSpaceOnUse">
      <stop stop-color="#162433"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <filter id="qp-shadow" x="90" y="100" width="1000" height="490" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="qp-blur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1180" height="620" rx="44" fill="url(#qp-bg)"/>
  <circle cx="184" cy="108" r="118" fill="#A8D2EF" opacity="0.16" filter="url(#qp-blur)"/>
  <circle cx="1000" cy="522" r="160" fill="#B8E3C8" opacity="0.12" filter="url(#qp-blur)"/>

  <g opacity="0.28" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
    <rect x="86" y="82" width="1008" height="456" rx="30" fill="#111821" stroke="#344252"/>
    <rect x="134" y="132" width="190" height="24" rx="12" fill="#334153"/>
    <rect x="134" y="184" width="382" height="18" rx="9" fill="#2B3847"/>
    <rect x="134" y="222" width="260" height="18" rx="9" fill="#25313F"/>
    <rect x="748" y="140" width="260" height="22" rx="11" fill="#2C3A4A"/>
    <rect x="748" y="184" width="294" height="124" rx="20" fill="#18212C" stroke="#334252"/>
    <rect x="748" y="334" width="294" height="124" rx="20" fill="#18212C" stroke="#334252"/>
  </g>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
    <text x="590" y="92" text-anchor="middle" fill="#DDE6F0" font-size="26" font-weight="800" textLength="340" lengthAdjust="spacingAndGlyphs">어디서든 바로 문서 검색</text>
    <text x="590" y="124" text-anchor="middle" fill="#8FA3B8" font-size="16" font-weight="580" textLength="386" lengthAdjust="spacingAndGlyphs">전역 단축키 · 접두어 검색 · Ctrl/Cmd K 작업</text>

    <g filter="url(#qp-shadow)">
      <rect x="150" y="150" width="880" height="376" rx="30" fill="url(#qp-panel)" stroke="#6F8EAA" stroke-opacity="0.74"/>
      <rect x="150.5" y="150.5" width="879" height="375" rx="29.5" stroke="white" stroke-opacity="0.06"/>

      <rect x="192" y="194" width="796" height="66" rx="22" fill="#0B1219" stroke="#50677C"/>
      <text x="220" y="237" fill="#EAF2F8" font-size="28" font-weight="780" textLength="148" lengthAdjust="spacingAndGlyphs">pdf c 예산안</text>
      <rect x="820" y="210" width="68" height="34" rx="17" fill="#223447" stroke="#4B6378"/>
      <text x="854" y="233" text-anchor="middle" fill="#DDEAF3" font-size="14" font-weight="800">PDF</text>
      <rect x="900" y="210" width="62" height="34" rx="17" fill="#1C3E31" stroke="#5A9473"/>
      <text x="931" y="233" text-anchor="middle" fill="#DDF7E7" font-size="14" font-weight="800">본문</text>

      <text x="198" y="300" fill="#99C8EB" font-size="16" font-weight="800" letter-spacing="1.2" textLength="72" lengthAdjust="spacingAndGlyphs">3개 문서</text>
      <text x="320" y="300" fill="#9AA7B5" font-size="15" font-weight="580" textLength="304" lengthAdjust="spacingAndGlyphs">↑↓ 이동 · Enter 상세 · Ctrl/Cmd K 작업</text>

      <rect x="192" y="324" width="540" height="84" rx="18" fill="url(#qp-row)" stroke="#95C8EA" stroke-opacity="0.86"/>
      <rect x="218" y="348" width="38" height="38" rx="10" fill="#132235" stroke="#5A7690"/>
      <text x="237" y="373" text-anchor="middle" fill="#9CD3F5" font-size="13" font-weight="800">PDF</text>
      <text x="276" y="362" fill="#EEF5FC" font-size="21" font-weight="800" textLength="220" lengthAdjust="spacingAndGlyphs">2026_예산안_검토.pdf</text>
      <text x="276" y="388" fill="#AAB7C4" font-size="14" font-weight="580" textLength="146" lengthAdjust="spacingAndGlyphs">기획팀 · PDF · 쪽 12</text>
      <rect x="576" y="346" width="70" height="26" rx="13" fill="#A20F2E"/>
      <text x="611" y="364" text-anchor="middle" fill="#FFEAF0" font-size="14" font-weight="820">PDF</text>
      <circle cx="694" cy="366" r="8" fill="#98C7E6"/>

      <rect x="192" y="424" width="540" height="52" rx="16" fill="#101821" stroke="#2D3A47" opacity="0.68"/>
      <rect x="218" y="437" width="38" height="26" rx="8" fill="#123525" stroke="#35684B"/>
      <text x="237" y="455" text-anchor="middle" fill="#A6E1BE" font-size="12" font-weight="800">XLS</text>
      <text x="276" y="457" fill="#C5D0DB" font-size="17" font-weight="700" textLength="178" lengthAdjust="spacingAndGlyphs">분기별_예산_요약.xlsx</text>

      <rect x="766" y="302" width="222" height="176" rx="22" fill="#111922" stroke="#3F5062"/>
      <text x="790" y="332" fill="#9CCCF0" font-size="14" font-weight="820" letter-spacing="1.1" textLength="86" lengthAdjust="spacingAndGlyphs">Ctrl/Cmd K</text>
      <text x="790" y="360" fill="#F0F6FB" font-size="20" font-weight="800">문서 작업</text>
      <rect x="790" y="380" width="174" height="28" rx="10" fill="#223447"/>
      <text x="812" y="399" fill="#E9F2FB" font-size="14" font-weight="700">파일 열기</text>
      <rect x="790" y="416" width="174" height="28" rx="10" fill="#17222D"/>
      <text x="812" y="435" fill="#C8D4DF" font-size="14" font-weight="650">위치 열기</text>
      <rect x="790" y="452" width="174" height="28" rx="10" fill="#17222D"/>
      <text x="812" y="471" fill="#C8D4DF" font-size="14" font-weight="650">경로 복사</text>
    </g>
  </g>
</svg>
