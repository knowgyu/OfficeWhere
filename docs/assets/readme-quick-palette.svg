<svg width="1180" height="620" viewBox="0 0 1180 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" text-rendering="geometricPrecision">
  <title id="title">OfficeWhere quick search palette</title>
  <desc id="desc">A polished dark quick search palette with a global shortcut, prefix search, document results, and Ctrl/Cmd K actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1180" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1520"/>
      <stop offset="0.5" stop-color="#090F16"/>
      <stop offset="1" stop-color="#132336"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(166 104) rotate(51.7) scale(264 232)">
      <stop stop-color="#9FD0F1" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9FD0F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 512) rotate(-139) scale(302 260)">
      <stop stop-color="#9FE7BC" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#9FE7BC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="155" x2="0" y2="525" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151F2A"/>
      <stop offset="1" stop-color="#0D141C"/>
    </linearGradient>
    <linearGradient id="selected" x1="188" y1="318" x2="794" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17283A"/>
      <stop offset="1" stop-color="#101922"/>
    </linearGradient>
    <filter id="shadow" x="80" y="110" width="1020" height="460" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000814" flood-opacity="0.48"/>
    </filter>
    <filter id="smallShadow" x="760" y="288" width="260" height="210" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000814" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1180" height="620" rx="44" fill="url(#bg)"/>
  <rect width="1180" height="620" rx="44" fill="url(#glowLeft)"/>
  <rect width="1180" height="620" rx="44" fill="url(#glowRight)"/>

  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif">
    <text x="590" y="74" text-anchor="middle" fill="#E8F1FA" font-size="30" font-weight="800">빠른 검색 팔레트</text>
    <text x="590" y="108" text-anchor="middle" fill="#91A4B8" font-size="16" font-weight="560">앱 창을 찾지 않고 문서를 바로 열고, 필요한 작업만 즉시 실행합니다</text>

    <g font-size="14" font-weight="760">
      <rect x="314" y="128" width="128" height="34" rx="17" fill="#162536" stroke="#354B61"/>
      <text x="378" y="150" text-anchor="middle" fill="#D7E6F3">Ctrl + Alt + F</text>
      <path d="M456 145H492" stroke="#4D6478" stroke-width="2" stroke-linecap="round"/>
      <path d="M486 137L494 145L486 153" stroke="#4D6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="508" y="128" width="142" height="34" rx="17" fill="#142A3C" stroke="#47728E"/>
      <text x="579" y="150" text-anchor="middle" fill="#E4F2FB">pdf c 예산안</text>
      <path d="M664 145H700" stroke="#4D6478" stroke-width="2" stroke-linecap="round"/>
      <path d="M694 137L702 145L694 153" stroke="#4D6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="716" y="128" width="142" height="34" rx="17" fill="#173426" stroke="#467B5B"/>
      <text x="787" y="150" text-anchor="middle" fill="#DFF7E8">Ctrl/Cmd K</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="142" y="182" width="896" height="346" rx="30" fill="url(#panel)" stroke="#607B94" stroke-opacity="0.78"/>
      <rect x="142.5" y="182.5" width="895" height="345" rx="29.5" stroke="white" stroke-opacity="0.07"/>

      <rect x="188" y="222" width="804" height="66" rx="22" fill="#0B1219" stroke="#4E667B"/>
      <text x="222" y="263" fill="#F2F7FC" font-size="28" font-weight="780">pdf c 예산안</text>
      <rect x="840" y="239" width="66" height="32" rx="16" fill="#24384C" stroke="#4F6C83"/>
      <text x="873" y="260" text-anchor="middle" fill="#DDEAF3" font-size="13" font-weight="820">PDF</text>
      <rect x="920" y="239" width="56" height="32" rx="16" fill="#1E4635" stroke="#5D9B75"/>
      <text x="948" y="260" text-anchor="middle" fill="#DDF7E7" font-size="13" font-weight="820">본문</text>

      <text x="190" y="324" fill="#9DCDF0" font-size="15" font-weight="800" letter-spacing="1.1">3개 문서</text>
      <text x="315" y="324" fill="#9BAABA" font-size="14" font-weight="570">↑↓ 이동 · Enter 상세 · Ctrl/Cmd K 작업</text>

      <rect x="188" y="346" width="606" height="86" rx="18" fill="url(#selected)" stroke="#91C7EA" stroke-opacity="0.88"/>
      <rect x="216" y="371" width="38" height="38" rx="10" fill="#132235" stroke="#5B7A92"/>
      <text x="235" y="395" text-anchor="middle" fill="#9CD3F5" font-size="13" font-weight="820">PDF</text>
      <text x="276" y="382" fill="#F1F6FB" font-size="21" font-weight="800">2026_예산안_검토.pdf</text>
      <text x="276" y="411" fill="#AAB8C7" font-size="14" font-weight="560">기획팀 · PDF · 쪽 12</text>
      <rect x="626" y="372" width="70" height="26" rx="13" fill="#B80D2E"/>
      <text x="661" y="390" text-anchor="middle" fill="#FFEAF0" font-size="13" font-weight="820">PDF</text>
      <circle cx="748" cy="389" r="7" fill="#98C7E6"/>

      <rect x="188" y="448" width="606" height="48" rx="16" fill="#101821" stroke="#2E3C49" opacity="0.70"/>
      <rect x="216" y="460" width="38" height="24" rx="8" fill="#123525" stroke="#35684B"/>
      <text x="235" y="476" text-anchor="middle" fill="#A6E1BE" font-size="12" font-weight="820">XLS</text>
      <text x="276" y="477" fill="#C4D0DB" font-size="16" font-weight="700">분기별_예산_요약.xlsx</text>

      <g filter="url(#smallShadow)">
        <rect x="816" y="338" width="176" height="158" rx="22" fill="#111A23" stroke="#42566A"/>
        <text x="838" y="369" fill="#9CCCF0" font-size="12" font-weight="820" letter-spacing="1.1">Ctrl/Cmd K</text>
        <text x="838" y="394" fill="#F0F6FB" font-size="20" font-weight="800">문서 작업</text>
        <rect x="838" y="411" width="132" height="28" rx="10" fill="#24374A"/>
        <text x="858" y="430" fill="#EAF2FB" font-size="14" font-weight="700">파일 열기</text>
        <rect x="838" y="446" width="132" height="28" rx="10" fill="#17232E"/>
        <text x="858" y="465" fill="#C8D4DF" font-size="14" font-weight="650">위치 열기</text>
      </g>
    </g>
  </g>
</svg>
