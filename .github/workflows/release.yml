name: Build Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "릴리스 태그 (예: v0.3.5). 비워두면 Actions artifact만 생성합니다."
        required: false
        type: string
      release_name:
        description: "GitHub Release 제목. 비워두면 기본값을 사용합니다."
        required: false
        type: string
      draft:
        description: "새 Release를 draft로 생성합니다."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"
  VENV_CACHE_VERSION: "v1"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  electron_config_cache: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  release-metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      release_name: ${{ steps.meta.outputs.release_name }}
      draft: ${{ steps.meta.outputs.draft }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          dispatch_tag="${INPUT_RELEASE_TAG:-}"

          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          elif [[ -n "$dispatch_tag" ]]; then
            tag="$(echo "$dispatch_tag" | xargs)"
          else
            tag=""
          fi

          if [[ -n "$tag" ]]; then
            version="$tag"
          else
            version="manual-${GITHUB_SHA:0:7}"
          fi

          release_name_input="${INPUT_RELEASE_NAME:-}"
          if [[ -n "$release_name_input" ]]; then
            release_name="$(echo "$release_name_input" | xargs)"
          elif [[ -n "$tag" ]]; then
            release_name="OfficeWhere $tag"
          else
            release_name="OfficeWhere $version"
          fi

          draft="${INPUT_DRAFT:-false}"
          if [[ "$draft" != "true" ]]; then
            draft="false"
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "release_name=$release_name"
            echo "draft=$draft"
          } >> "$GITHUB_OUTPUT"

  backend-verification:
    name: Backend verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Cache Python virtualenv
        id: backend-venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-venv-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}-${{ env.VENV_CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-python-${{ env.PYTHON_VERSION }}-venv-

      - name: Prepare Python virtualenv
        id: prepare-python-venv
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x .venv/bin/python ]]; then
            echo "needs_install=false" >> "$GITHUB_OUTPUT"
          else
            rm -rf .venv
            python -m venv .venv
            echo "needs_install=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Python dependencies for tests
        if: steps.backend-venv-cache.outputs.cache-hit != 'true' || steps.prepare-python-venv.outputs.needs_install == 'true'
        run: .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: .venv/bin/python -m pytest -q

      - name: Run demo checks
        run: .venv/bin/python scripts/run_demo_checks.py

  windows-release:
    name: Windows x64
    needs: release-metadata
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve frontend dependency cache key
        id: frontend-cache-key
        shell: bash
        run: python scripts/ci_frontend_cache_key.py >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: .cache/npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-${{ steps.frontend-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-

      - name: Cache frontend node_modules
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-modules-${{ steps.frontend-cache-key.outputs.hash }}

      - name: Cache Electron package downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.frontend-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Verify bundled Python runtime exists
        shell: pwsh
        run: |
          if (-not (Test-Path "python-runtime/win-x64/python.exe")) {
            throw "Bundled Python runtime is missing: python-runtime/win-x64/python.exe"
          }

      - name: Install frontend dependencies
        if: steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        shell: pwsh
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build frontend
        working-directory: frontend
        shell: pwsh
        run: npm run build

      - name: Build Electron main process
        working-directory: frontend
        shell: pwsh
        run: npm run build:electron

      - name: Build Electron Windows zip
        working-directory: frontend
        shell: pwsh
        run: npm run package:win

      - name: Package Windows release bundle
        id: bundle
        shell: pwsh
        run: |
          $bundleName = "officewhere-${{ needs.release-metadata.outputs.version }}-windows-x64"

          if (Test-Path "$bundleName.zip") {
            Remove-Item "$bundleName.zip" -Force
          }
          if (Test-Path "$bundleName.sha256.txt") {
            Remove-Item "$bundleName.sha256.txt" -Force
          }

          $sourceZip = Get-ChildItem "dist/electron" -Filter "officewhere-*-windows-x64.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $sourceZip) {
            throw "Electron zip artifact was not created."
          }

          Copy-Item -Path $sourceZip.FullName -Destination "$bundleName.zip" -Force

          $hash = (Get-FileHash "$bundleName.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$bundleName.sha256.txt" -Value "$hash  $bundleName.zip" -Encoding Ascii

          "bundle_name=$bundleName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=$bundleName.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "sha_path=$bundleName.sha256.txt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Windows workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.bundle_name }}
          path: |
            ${{ steps.bundle.outputs.zip_path }}
            ${{ steps.bundle.outputs.sha_path }}
          if-no-files-found: error

  macos-release:
    name: macOS arm64
    needs: release-metadata
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve frontend dependency cache key
        id: frontend-cache-key
        shell: bash
        run: python scripts/ci_frontend_cache_key.py >> "$GITHUB_OUTPUT"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: .cache/npm
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-${{ steps.frontend-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-npm-

      - name: Cache frontend node_modules
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-modules-${{ steps.frontend-cache-key.outputs.hash }}

      - name: Cache Electron package downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-${{ steps.frontend-cache-key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Cache macOS backend runtime
        uses: actions/cache@v4
        with:
          path: |
            .cache/python-runtime
            python-runtime/mac-arm64
          key: ${{ runner.os }}-python-runtime-mac-arm64-${{ hashFiles('requirements.txt', 'scripts/prepare_python_runtime.py') }}
          restore-keys: |
            ${{ runner.os }}-python-runtime-mac-arm64-

      - name: Install frontend dependencies
        if: steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Electron main process
        working-directory: frontend
        run: npm run build:electron

      - name: Prepare macOS backend runtime
        working-directory: frontend
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run prepare:python-runtime:mac

      - name: Build Electron macOS app
        working-directory: frontend
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: npx electron-builder --mac --publish never

      - name: Package macOS release bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_name="officewhere-${{ needs.release-metadata.outputs.version }}-mac-arm64"

          rm -f "$bundle_name.dmg" "$bundle_name.dmg.sha256.txt"
          rm -f "$bundle_name.zip" "$bundle_name.zip.sha256.txt"

          dmg="$(ls -t dist/electron/officewhere-*-mac-arm64.dmg | head -n 1)"
          zip="$(ls -t dist/electron/officewhere-*-mac-arm64.zip | head -n 1)"

          test -f "$dmg"
          test -f "$zip"

          cp "$dmg" "$bundle_name.dmg"
          cp "$zip" "$bundle_name.zip"

          shasum -a 256 "$bundle_name.dmg" > "$bundle_name.dmg.sha256.txt"
          shasum -a 256 "$bundle_name.zip" > "$bundle_name.zip.sha256.txt"

          {
            echo "bundle_name=$bundle_name"
            echo "dmg_path=$bundle_name.dmg"
            echo "dmg_sha_path=$bundle_name.dmg.sha256.txt"
            echo "zip_path=$bundle_name.zip"
            echo "zip_sha_path=$bundle_name.zip.sha256.txt"
          } >> "$GITHUB_OUTPUT"

      - name: Upload macOS workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.bundle_name }}
          path: |
            ${{ steps.bundle.outputs.dmg_path }}
            ${{ steps.bundle.outputs.dmg_sha_path }}
            ${{ steps.bundle.outputs.zip_path }}
            ${{ steps.bundle.outputs.zip_sha_path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    if: needs.release-metadata.outputs.tag != ''
    needs:
      - release-metadata
      - backend-verification
      - windows-release
      - macos-release
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: officewhere-*
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRAFT: ${{ needs.release-metadata.outputs.draft }}
          RELEASE_NAME: ${{ needs.release-metadata.outputs.release_name }}
          RELEASE_TAG: ${{ needs.release-metadata.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi

          args=(
            release create "$RELEASE_TAG" "${assets[@]}"
            --title "$RELEASE_NAME"
            --notes "Windows x64 and macOS arm64 desktop builds generated by GitHub Actions."
          )

          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            args+=(--target "$GITHUB_SHA")
          fi

          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          gh "${args[@]}"
