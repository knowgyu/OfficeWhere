name: Frontend tests

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/ci_frontend_cache_key.py"
      - ".github/workflows/frontend-tests.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/ci_frontend_cache_key.py"
      - ".github/workflows/frontend-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Build + Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve frontend dependency cache key
        id: frontend-cache-key
        working-directory: .
        run: python scripts/ci_frontend_cache_key.py >> "$GITHUB_OUTPUT"

      - name: Cache frontend node_modules
        id: frontend-node-modules-cache
        uses: actions/cache@v5
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node-24-modules-${{ steps.frontend-cache-key.outputs.hash }}

      - name: Install frontend dependencies
        if: steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --fund=false

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run build:electron

      - name: Type-check Playwright E2E specs
        run: npx tsc -p tsconfig.e2e.json

      - name: Run Vitest
        run: npm run test:run
